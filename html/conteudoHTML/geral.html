<!--COMENTÁRIO-->
<!-- DOCTYPE é semântico e indica o tipo de arquivo a ser criado -->
<!DOCTYPE html>
<html lang="pt-br">
    <!-- Elemento head: onde ficam algumas "configurações" do site -->
    <head>
        <!-- 
        tags meta são reponsáveis por direcionar o algoritmo de buscar dos navegadores
        e também para definir alguns parâmetros iniciais como charset
         -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="DESCRIÇÃO">
        <!-- Título do site -->
        <title>Geral de HTML 5</title>
    </head>
    <body>
        <h1>Estudo feito pelo <a href="https://www.freecodecamp.org/learn" target="_parent">freeCodeCamp</a> + <a href="https://www.cursoemvideo.com/" target="_blank">Curso em Vídeo</a></h1>
        <h2>by: joso_leirbag</h2>
        
        <!-- <section> é o mesmo que div, porém semântico -->
        <section>
            <h2>Áudio & Vídeo em HTML</h2>
            <!-- <audio> elemento que possui atributos e métodos para exibição de áudio -->
            <!-- controls, loop, etc são booleanos que quando presentes posssuem valor True -->
            <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" controls loop autoplay muted>
                <!-- <source>: elemento que ajuda o navegador a utilizar o tipo de arquivo ele sabe ler -->
                <source src="audio.ogg" type="audio/ogg">
                <source src="audio.wav" type="audio/wav">
                <source src="audio.mp3" type="audio/mpeg">
            </audio>
            <!-- <video>: análogo à <audio> possui os mesmos atributos e até mais, como o poster que adiciona a thumb -->
            <video src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" controls poster="https://peach.blender.org/wp-content/uploads/title_anouncement.jpg?x11217" width="300"></video>
        </section>
        <section>
            <!-- <iframe>: o frame imbutido pode incorporar qualquer página html ao site inclusive, vídeos, mapas, ... -->
            <h2>Iframe</h2>
            <iframe width="300" height="200" src="https://www.youtube.com/embed/PkZNo7MFNFg?si=-UBVIUNM3csdeiWF" title="Learn JavaScript - Full Course for Beginners (YouTube video)" allowfullscreen></iframe>
            <iframe width="300" height="200" src="geral.html"></iframe>
        </section>
        <section>
            <h2>Randons</h2>
            <p>uma cara feliz em svg</p>
            <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="black" stroke-width="4" fill="yellow" />
                <circle cx="35" cy="40" r="5" fill="black" />
                <circle cx="65" cy="40" r="5" fill="black" />
                <path d="M35 65 Q50 80 65 65" stroke="black" stroke-width="4" fill="transparent" />
              </svg>
              <svg width="24" height="24" viewBox="0 0 24 24">
                <path
                  d="M12 21s-6-4.35-9.33-8.22C-.5 7.39 3.24 1 8.4 4.28 10.08 5.32 12 7.5 12 7.5s1.92-2.18 3.6-3.22C20.76 1 24.5 7.39 21.33 12.78 18 16.65 12 21 12 21z"
                  fill="red"
                ></path>
              </svg>
        </section>
    </body>
</html>
