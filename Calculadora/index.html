<!DOCTYPE html>
<html lang="pt-br">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-Vindo(a) à minha Calculadora!</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="links">
        <a href="/html/conteudoHTML/geral.html"><span class="material-icons" style="color: black;">home</span>Home</a>
        <a href="https:/github.com/jg2ol" target="_blank"><img src="/images/github.png" alt="">Github</a>
    </header>

    <div id="comment">
        <h1>Calculadora simples feita com HTML, CSS e JavaScript</h1>
        <h2>By: João Gabriel</h2>
        <h3>Haverá possíveir atualizações...</h3>
    </div>

    <section id="calculadora">
        <div class="expression">
            <p id="result"></p>
            <p id="pre_result">0</p>
        </div>
        <div class="botoes">
            <div class="botao" id="limpa"><p>AC</p></div>
            <div class="botao" id="retira"><p><span class="material-icons">backspace</span></p></div>
            <div class="botao operador"><p>%</p></div>
            <div class="botao operador" id="percent"><p>÷</p></div>
            <div class="botao num"><p>1</p></div>
            <div class="botao num"><p>2</p></div>
            <div class="botao num"><p>3</p></div>
            <div class="botao operador"><p>x</p></div>
            <div class="botao num"><p>4</p></div>
            <div class="botao num"><p>5</p></div>
            <div class="botao num"><p>6</p></div>
            <div class="botao operador"><p>-</p></div>
            <div class="botao num"><p>7</p></div>
            <div class="botao num"><p>8</p></div>
            <div class="botao num"><p>9</p></div>
            <div class="botao operador"><p>+</p></div>
            <div></div>
            <div class="botao num"><p>0</p></div>
            <div></div>
            <div class="botao" id="igual"><p>=</p></div>
        </div>
    </section>

    <footer class="links">
        <a href="index.html">Tela Inicial</a>
    </footer>
</body>
<script src="script.js"></script>
</html>
