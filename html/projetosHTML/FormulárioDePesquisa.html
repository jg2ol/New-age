<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
</head>

<body>
    <h1 id="title">Pesquisa de Feedback do Formulário</h1>
    <p id="description">Queremos saber se você achou esse formulário bem feito.</p>
    <form id="survey-form">
        <label id="name-label" for="name">Nome (obrigatório):</label>
        <input type="text" required id="name" placeholder="Seu nome aqui">
        
        <label id="email-label" for="email">Email (obrigatório):</label>
        <input type="email" required id="email" placeholder="exemplo@gmail.com">
        
        <label id="number-label" for="number">Idade (opcional):</label>
        <input type="number" id="number" min="10" max="100" placeholder="26">
        
        <label for="dropdown">Sexo:</label>
        <select id="dropdown">
            <option>Feminino</option>
            <option>Masculino</option>
            <option>Prefiro não dizer</option>
        </select>

        <p id="questionRADIO">Você gostou desse formulário?</p>
        <input type="radio" id="yes-option" value="Y" name="gosto">
        <label for="yes-option">Sim</label>
        <input type="radio" id="no-option" value="N" name="gosto">
        <label for="no-option">Não</label>
        <br>

        <p id="questionCHECKBOX">O que você acha que podemos melhorar (pode selecionar mais de um)?</p>
        <input type="checkbox" id="estuct" value="estruct" name="up">
        <label for="est">Estrutura / Ordem das perguntas</label>
        
        <input type="checkbox" id="num_questions" value="num_questions" name="up">
        <label for="num_questions">Tem muitas perguntas</label>
        
        <input type="checkbox" id="style" value="style" name="up">
        <label for="style">Estilo da página (cores)</label>
        <br>

        <label for="comments">Se tiver um comentário, queremos saber:</label>
        <textarea id="comments" rows="4" cols="30"></textarea>
        <br>

        <button type="submit" id="submit">Enviar Formulário</button>
        <button type="reset" id="reset">Reiniciar Formulário</button>
    </form>
</body>
</html>
